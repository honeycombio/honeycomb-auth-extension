name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: "honeycombauthextension/go.sum"

      - name: Validate tag format
        run: |
          if [[ ! "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Invalid tag format: ${{ github.ref_name }}"
            exit 1
          fi

      - name: Run test suite
        run: make test

      - name: Verify module builds
        run: |
          cd honeycombauthextension
          go build -v ./...

      - name: Create Go module checksum
        run: |
          mkdir -p dist
          cd honeycombauthextension
          sha256sum go.mod go.sum > ../dist/module-checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            dist/module-checksums.txt
          generate_release_notes: true
          body: |
            ## Usage

            Add this extension to your OpenTelemetry Collector builder config:

            ```yaml
            extensions:
              - gomod: github.com/${{ github.repository }}/honeycombauthextension ${{ github.ref_name }}
            ```

            Then reference it as an authenticator on the OTLP receiver. See the
            [README](https://github.com/${{ github.repository }}/blob/main/README.md) for configuration.

            ## What's Changed
            See the changelog below.
