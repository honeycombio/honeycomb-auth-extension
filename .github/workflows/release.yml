name: release

# The component is a Go module in the honeycombauthextension/ subdirectory, so
# module version tags must carry the subdirectory prefix (Go requirement):
#   git tag honeycombauthextension/v0.1.0
on:
  push:
    tags:
      - "honeycombauthextension/v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: "honeycombauthextension/go.sum"

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#honeycombauthextension/}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Invalid tag format: $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run test suite
        run: make test

      - name: Verify module builds
        run: |
          cd honeycombauthextension
          go build -v ./...

      - name: Create Go module checksum
        run: |
          mkdir -p dist
          cd honeycombauthextension
          sha256sum go.mod go.sum > ../dist/module-checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
          files: |
            dist/module-checksums.txt
          generate_release_notes: true
          body: |
            ## Usage

            Add this extension to your OpenTelemetry Collector builder config:

            ```yaml
            extensions:
              - gomod: github.com/${{ github.repository }}/honeycombauthextension ${{ steps.version.outputs.version }}
            ```

            Then reference it as an authenticator on the OTLP receiver. See the
            [README](https://github.com/${{ github.repository }}/blob/main/README.md) for configuration.

            ## What's Changed
            See the changelog below.
