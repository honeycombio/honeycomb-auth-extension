name: build-and-test

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  merge_group:
  pull_request:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: "honeycombauthextension/go.sum"
      - name: Test
        run: |
          cd honeycombauthextension
          go test -race -coverprofile=coverage.txt -covermode=atomic ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: "honeycombauthextension/go.sum"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: honeycombauthextension
          args: --config=../.golangci.yml --timeout=5m

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: "honeycombauthextension/go.sum"
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd honeycombauthextension
          govulncheck ./...

  mdatagen-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: "honeycombauthextension/go.sum"
      - name: Verify generated code is up to date
        run: |
          cd honeycombauthextension
          go tool mdatagen metadata.yaml || go run go.opentelemetry.io/collector/cmd/mdatagen metadata.yaml
          git diff --exit-code || (echo "generated code is stale; run 'make generate'" && exit 1)
