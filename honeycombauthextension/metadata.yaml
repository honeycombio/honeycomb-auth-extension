type: honeycomb_auth

status:
  class: extension
  stability:
    alpha: [extension]
  distributions: []
  codeowners:
    active: [MikeGoldsmith]

attributes:
  outcome:
    description: Result of the authentication attempt.
    type: string
    enum:
      - valid
      - valid_stale
      - missing_header
      - invalid_key
      - team_not_allowed
      - environment_not_allowed
      - classic_not_allowed
      - no_ingest_scope
      - backend_error
  team:
    description: >-
      Team slug the key resolved to. Recorded unless include_team_attribute is
      disabled, and only when the key resolved via /1/auth (absent for
      missing_header, invalid_key, and backend_error outcomes).
    type: string

telemetry:
  metrics:
    honeycomb_auth.authentications:
      enabled: true
      stability: alpha
      description: Number of authentication attempts, by outcome.
      unit: "{authentication}"
      sum:
        value_type: int
        monotonic: true
      attributes: [outcome, team]

tests:
  config:
    endpoint: https://api.honeycomb.io
    allowed_teams: [acme]
    allowed_environments: [prod]
    allow_classic: true
    cache:
      ttl: 5m
      negative_ttl: 30s
      stale_ttl: 1h
      max_keys: 1000
