dist:
  name: otelcol-honeycomb-auth-example
  description: Example Collector distro with the honeycomb_auth extension
  output_path: ./_build

extensions:
  - gomod: github.com/honeycombio/honeycomb-auth-extension/honeycombauthextension v0.0.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.157.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.157.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.63.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.63.0

# Relative to the generated module in ./_build, so the build works anywhere
# the repo is checked out (including CI).
replaces:
  - github.com/honeycombio/honeycomb-auth-extension/honeycombauthextension => ../../honeycombauthextension
