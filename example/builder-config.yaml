dist:
  name: otelcol-honeycombauth-example
  description: Example Collector distro with the honeycombauth extension
  output_path: ./_build

extensions:
  - gomod: github.com/honeycombio/honeycomb-auth-extension/honeycombauthextension v0.0.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.155.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.155.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.61.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.61.0

replaces:
  - github.com/honeycombio/honeycomb-auth-extension/honeycombauthextension => /Users/mike/code/honeycomb-auth-extension/honeycombauthextension
